# ASM2Web — server-level nginx locations
# Pattern: include vanuit /etc/nginx/sites-enabled/horsecloud (zoals llmshapes/horsesafe/etc).
# Geen poort, geen backend: statische HTML/CSS/JS/JSON + (later) .wasm.

location = /ASM2Web {
    auth_basic off;
    return 301 /ASM2Web/;
}

location /ASM2Web/ {
    auth_basic off;
    alias /var/www/asm2web/web/;
    index index.html;
    try_files $uri $uri/ /ASM2Web/index.html;

    types {
        text/html                 html;
        text/css                  css;
        text/javascript           js;
        application/json          json;
        application/wasm          wasm;
        image/svg+xml             svg;
        application/octet-stream  bin;
    }

    # No-cache voor HTML/JS/CSS/JSON (revalidatie elke load — fase 0 ontwikkel-modus)
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # WASM-modules krijgen immutable cache override (vanaf fase 3 relevant; content-versioned)
    location ~* \.wasm$ {
        auth_basic off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
}
